<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0714">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/api/icon?s=192">
<link rel="apple-touch-icon" href="/api/icon?s=192">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Anuki ♥ Rivishan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --p: #e11d48;
  --s: #38bdf8;
  --bg: #0b0714;
  --card: #151024;
  --tx: #f8fafc;
  --muted: #94a3b8;
  --r: 22px;
  --p-soft: color-mix(in srgb, var(--p) 18%, transparent);
  --s-soft: color-mix(in srgb, var(--s) 16%, transparent);
  --border: color-mix(in srgb, var(--tx) 10%, transparent);
  --border-p: color-mix(in srgb, var(--p) 38%, transparent);
  --border-s: color-mix(in srgb, var(--s) 35%, transparent);
}

* {
  box-sizing: border-box;
  margin: 0;
  -webkit-tap-highlight-color: transparent;
}

[hidden] {
  display: none !important;
}

html, body {
  min-height: 100%;
}

body {
  background: var(--bg) center / cover fixed;
  color: var(--tx);
  font: 15px/1.65 'Plus Jakarta Sans', 'Noto Sans Sinhala', system-ui, sans-serif;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(65% 45% at 10% 0%, var(--p-soft), transparent),
    radial-gradient(55% 40% at 95% 30%, var(--s-soft), transparent),
    linear-gradient(180deg, rgba(11, 7, 20, 0.4) 0%, rgba(11, 7, 20, 0.82) 100%);
  z-index: 0;
}

#fx {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.65;
}
#fx.top {
  z-index: 35;
  opacity: 1;
}

/* ---------- Layout & Header ---------- */
.app {
  position: relative;
  z-index: 1;
  max-width: 540px;
  margin: auto;
  padding: calc(20px + env(safe-area-inset-top)) 16px 115px;
}

header {
  text-align: center;
  padding: 12px 10px 18px;
  margin-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #ffffff;
  line-height: 1.3;
}

.sub {
  font-size: 13px;
  font-weight: 500;
  color: var(--s);
  margin-top: 4px;
  letter-spacing: 0.02em;
}

.nick {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--tx);
  background: var(--p-soft);
  border: 1px solid var(--border-p);
  border-radius: 999px;
}

/* ---------- Distinct Cards ---------- */
.card {
  position: relative;
  background: color-mix(in srgb, var(--card) 90%, transparent);
  border: 1px solid var(--border);
  border-top: 2px solid var(--border-p);
  border-radius: var(--r);
  padding: 18px;
  margin: 16px 0;
  box-shadow: 0 10px 28px -8px rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(12px);
}

.card.c2 {
  border-top-color: var(--border-s);
}

.card h3 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.01em;
}

.card p {
  color: color-mix(in srgb, var(--tx) 92%, transparent);
  font-size: 14.5px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  color: var(--s);
}

/* ---------- Counters & Typography ---------- */
.big {
  font-size: 42px;
  font-weight: 700;
  line-height: 1.1;
  color: var(--p);
  letter-spacing: -0.02em;
}

.ct {
  text-align: center;
  margin: 6px 0;
}

.ct small {
  color: var(--muted);
  font-size: 13px;
}

.timer-pills {
  display: inline-flex;
  gap: 8px;
  margin-top: 8px;
  padding: 5px 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: var(--s);
}

/* ---------- Buttons & Inputs ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--border);
  color: var(--tx);
  background: rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  padding: 9px 16px;
  font: 600 13.5px/1.3 inherit;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
  margin: 6px 6px 0 0;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.09);
  border-color: var(--border-s);
}

.btn.p {
  border-color: var(--border-p);
  color: #ffffff;
  background: linear-gradient(135deg, var(--p), color-mix(in srgb, var(--p) 72%, #000));
  box-shadow: 0 4px 14px color-mix(in srgb, var(--p) 30%, transparent);
}

.btn:active {
  transform: scale(0.96);
}

.btn[disabled] {
  opacity: 0.45;
  cursor: not-allowed;
}

textarea {
  width: 100%;
  min-height: 80px;
  background: rgba(0, 0, 0, 0.28);
  color: var(--tx);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  font: inherit;
  font-size: 14px;
  margin-bottom: 8px;
  outline: none;
  transition: border-color 0.2s;
}

textarea:focus {
  border-color: var(--s);
}

/* ---------- Memories & List Items ---------- */
.mem img {
  width: 100%;
  border-radius: calc(var(--r) - 8px);
  margin-bottom: 12px;
  border: 1px solid var(--border);
  display: block;
}

.mem-date {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  color: var(--s);
  background: var(--s-soft);
  padding: 2px 10px;
  border-radius: 999px;
  margin-bottom: 6px;
}

.mem b {
  display: block;
  font-size: 16px;
  color: #fff;
  margin-bottom: 4px;
}

.it {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: 14px;
}

.it:last-child {
  margin-bottom: 0;
}

.it small {
  color: var(--muted);
  font-size: 12.5px;
}

/* ---------- 365-Day Love Plant Game UI ---------- */
.plant-box {
  background: radial-gradient(circle at 50% 25%, rgba(56, 189, 248, 0.12), rgba(15, 23, 42, 0.55));
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}

.plant-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}

.plant-stage-title {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
}

.plant-stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 10px 0;
}

.plant-stat {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px;
  text-align: center;
}

.plant-stat small {
  display: block;
  font-size: 11px;
  color: var(--muted);
}

.plant-stat b {
  font-size: 13.5px;
  color: #fff;
}

.meter-bar {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 5px;
}

.meter-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.4s ease;
}

.plant-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 10px;
}

.plant-actions .btn {
  margin: 0;
  padding: 10px 8px;
  font-size: 12.5px;
  flex-direction: column;
  gap: 3px;
  border-radius: 14px;
}

.plant-actions .btn.done {
  border-color: rgba(74, 222, 128, 0.45);
  background: rgba(74, 222, 128, 0.12);
  color: #86efac;
}

.plant-log {
  font-size: 12.5px;
  color: var(--s);
  text-align: center;
  margin-top: 8px;
  min-height: 20px;
}

@keyframes leafSway {
  0%, 100% { transform: rotate(-2deg); }
  50% { transform: rotate(2.5deg); }
}

.svg-tree-group {
  transform-origin: 130px 185px;
  animation: leafSway 4.5s ease-in-out infinite;
}

@keyframes dropFall {
  0% { opacity: 0.95; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(45px); }
}

.fx-drop {
  animation: dropFall 1s ease-in infinite;
}

@keyframes sunPulse {
  0%, 100% { opacity: 0.45; transform: scale(0.96); }
  50% { opacity: 0.85; transform: scale(1.06); }
}

.fx-sun {
  transform-origin: 215px 38px;
  animation: sunPulse 2.5s ease-in-out infinite;
}

/* ---------- Weekly Poll & Coupon Banner ---------- */
.status-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 14px;
  margin-bottom: 12px;
  border-radius: 12px;
  background: rgba(56, 189, 248, 0.09);
  border: 1px solid var(--border-s);
  font-size: 13px;
}

.picked-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
  border-radius: 12px;
  background: var(--p-soft);
  border: 1px solid var(--border-p);
  font-weight: 600;
  font-size: 13.5px;
  color: #fff;
}

/* ---------- Interactive Widgets ---------- */
.sc {
  position: relative;
  width: 310px;
  max-width: 100%;
  height: 175px;
  margin: 6px auto;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border-p);
  background: rgba(0, 0, 0, 0.4);
}

.sc .un {
  position: absolute;
  inset: 0;
  padding: 14px;
  font-size: 14px;
  overflow: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.sc .un img {
  max-width: 100%;
  max-height: 110px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 8px;
}

.sc canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
  transition: opacity 0.6s ease;
  cursor: pointer;
}

.sc canvas.off {
  opacity: 0;
  pointer-events: none;
}

.th {
  width: 136px;
  height: 136px;
  margin: 10px auto;
  border-radius: 50%;
  background: radial-gradient(circle, var(--p-soft) 0%, rgba(255,255,255,0.02) 75%);
  border: 2px solid var(--border-p);
  display: grid;
  place-items: center;
  font-size: 50px;
  box-shadow: 0 8px 25px color-mix(in srgb, var(--p) 22%, transparent);
  touch-action: none;
  user-select: none;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.th:active {
  animation: pulseBeat 0.65s infinite;
}

@keyframes pulseBeat {
  50% { transform: scale(1.1); }
}

.bomb {
  border: 1.5px solid var(--p);
  background: linear-gradient(135deg, color-mix(in srgb, var(--p) 22%, var(--card)), var(--card));
}

/* ---------- Birthday Cake SVG ---------- */
#cake .fl {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: fk 0.5s ease-in-out infinite alternate;
  transition: opacity 0.3s;
}
@keyframes fk {
  to { transform: scale(0.88, 1.15); }
}
#cake.off .fl {
  opacity: 0;
  animation: none;
}
#cake .sm {
  opacity: 0;
  fill: none;
  stroke: #cbd5e1;
  stroke-width: 1.6;
  transform-box: fill-box;
}
#cake.off .sm {
  animation: sm 2s ease-out forwards;
}
@keyframes sm {
  0% { opacity: 0.75; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-22px); }
}

/* ---------- Bottom Navigation Bar ---------- */
nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  display: flex;
  max-width: 540px;
  margin: auto;
  background: color-mix(in srgb, var(--card) 94%, #000);
  border-top: 1px solid var(--border);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  backdrop-filter: blur(16px);
}

nav button {
  flex: 1;
  background: transparent;
  border: 0;
  color: var(--muted);
  font: 600 12px/1.2 inherit;
  padding: 8px 4px;
  border-radius: 14px;
  cursor: pointer;
  transition: color 0.2s, background 0.2s;
}

nav button b {
  display: block;
  font-size: 20px;
  margin-bottom: 3px;
  filter: grayscale(0.85);
  transition: filter 0.2s, transform 0.2s;
}

nav button.on {
  color: #ffffff;
  background: var(--p-soft);
}

nav button.on b {
  filter: none;
  transform: translateY(-1px);
}

/* ---------- Floating Music Button ---------- */
#mu {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top));
  right: 14px;
  z-index: 12;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--card) 88%, #000);
  color: #fff;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
}

/* ---------- Lock Screen ---------- */
#lock {
  position: fixed;
  inset: 0;
  z-index: 25;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 24px;
  text-align: center;
}

#lock.sh {
  animation: sk 0.4s;
}
@keyframes sk {
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

.lock-badge {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--p-soft);
  border: 1px solid var(--border-p);
  display: grid;
  place-items: center;
  font-size: 24px;
  margin-bottom: 2px;
}

#dots {
  display: flex;
  gap: 10px;
  margin: 6px 0;
}

#dots b {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1.5px solid var(--muted);
  transition: all 0.2s;
}

#dots b.f {
  background: var(--p);
  border-color: var(--p);
  transform: scale(1.1);
}

#pad {
  display: grid;
  grid-template-columns: repeat(3, 68px);
  gap: 12px;
  margin-top: 4px;
}

#pad button {
  height: 68px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.04);
  color: #fff;
  font: 600 22px inherit;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}

#pad button:active {
  background: var(--p-soft);
  border-color: var(--p);
  transform: scale(0.94);
}

#wm {
  min-height: 44px;
  max-width: 320px;
  font-size: 13px;
  color: var(--s);
}

/* ---------- Modal & Toast ---------- */
#md {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(6px);
  display: grid;
  place-items: center;
  padding: 20px;
}

#md .card {
  max-width: 400px;
  width: 100%;
  text-align: center;
}

#md .card h3 {
  justify-content: center;
}

#ts {
  width: max-content;
  position: fixed;
  left: 50%;
  top: calc(14px + env(safe-area-inset-top));
  transform: translate(-50%, -150%);
  z-index: 40;
  max-width: 90%;
  background: var(--card);
  border: 1px solid var(--border-s);
  border-radius: 14px;
  padding: 10px 16px;
  font-size: 13.5px;
  font-weight: 600;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

#ts.on {
  transform: translate(-50%, 0);
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<!-- Lock Screen -->
<div id="lock">
  <div class="lock-badge">🔒</div>
  <h1 id="lt">Anuki ♥ Rivishan</h1>
  <p id="lq" style="max-width:320px;font-size:14px;color:var(--muted)">Loading...</p>
  <p style="font-size:12px;color:var(--s)">Enter our special date (YYYYMMDD)</p>
  <div id="dots"></div>
  <div id="pad"></div>
  <p id="wm"></p>
  <button class="btn" id="vh" data-a="vh" hidden>🎧 Play Voice Hint</button>
</div>

<!-- Main App Container -->
<main class="app" id="app" hidden></main>

<!-- Clean English Bottom Navigation -->
<nav id="nav" hidden>
  <button data-t="home"><b>🏠</b>Home</button>
  <button data-t="us"><b>💞</b>Us</button>
  <button data-t="play"><b>🎮</b>Games</button>
  <button data-t="inbox"><b>💌</b>Inbox</button>
</nav>

<button id="mu" title="Toggle Music" hidden>🎵</button>
<div id="md" hidden></div>
<div id="ts"></div>

<script>
const RAW = 'https://raw.githubusercontent.com/RiviMAX/anuki-love-app/main/config.json';
const HOOK = /vercel\.app|localhost/.test(location.hostname) ? '/api/webhook' : 'https://anuki-love-app.vercel.app/api/webhook';
const WEEK_MS = 7 * 86400 * 1000;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = {
  g(k, d) { try { return JSON.parse(localStorage.getItem('al_' + k)) ?? d; } catch { return d; } },
  s(k, v) { try { localStorage.setItem('al_' + k, JSON.stringify(v)); } catch {} },
  rm(k) { try { localStorage.removeItem('al_' + k); } catch {} }
};

let C, raw = '', tab = 'home', guest = false, mode = 'love', pin = '', wr = 0, prev = 0, q = { i: 0, s: 0 }, pool = '', plantFx = '';

const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

const fmtRemaining = ms => {
  if (ms <= 0) return 'Ready now!';
  const d = Math.floor(ms / 864e5);
  const h = Math.floor((ms % 864e5) / 36e5);
  const m = Math.max(1, Math.floor((ms % 36e5) / 6e4));
  return d > 0 ? `${d}d ${h}h` : h > 0 ? `${h}h ${m}m` : `${m}m`;
};

const post = (event, data = '') => {
  try {
    fetch(HOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source: 'anuki_app', event, data: String(data) }),
      keepalive: true
    });
  } catch {}
};

const toast = t => {
  const e = $('#ts');
  e.textContent = t;
  e.className = 'on';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.className = '', 4000);
};

const rnd = a => (Array.isArray(a) && a.length ? a[Math.floor(Math.random() * a.length)] : '');

async function load() {
  for (const u of [RAW + '?t=' + Date.now(), 'config.json']) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (r.ok) {
        const t = await r.text();
        if (t === raw) return false;
        C = JSON.parse(t);
        raw = t;
        checkRemoteReset();
        return true;
      }
    } catch {}
  }
  return false;
}

/* ---------- Remote /resetapp Sync Handler ---------- */
function checkRemoteReset() {
  if (!C) return;
  const sys = C.system_reset;
  if (sys && sys.reset_id && sys.reset_id !== ls.g('rst_id', 0)) {
    ls.s('rst_id', sys.reset_id);
    const t = (sys.target || 'all').toLowerCase();
    if (t === 'all' || t === 'poll') {
      ls.rm('poll_v2');
      if (C.interactive?.live_poll?.question_id) ls.rm('poll' + C.interactive.live_poll.question_id);
    }
    if (t === 'all' || t === 'coupons') {
      ls.rm('cp_v2');
      ls.rm('cp');
    }
    if (t === 'all' || t === 'plant') {
      ls.rm('plant_v2');
      ls.rm('pl');
    }
    if (t === 'all') {
      q = { i: 0, s: 0 };
    }
    if (!$('#lock').hidden === false) {
      toast(`🔄 App ${t.toUpperCase()} state has been reset!`);
    }
  }

  // Check remote plant boost or level override from webhook.js
  const ps = C.plant_state;
  if (ps) {
    const p = getPlantState();
    let changed = false;
    if (ps.sync_id && ps.sync_id !== p.syncId) {
      p.syncId = ps.sync_id;
      if (ps.override_day) p.daysCared = Math.min(365, Math.max(1, ps.override_day));
      if (ps.override_xp !== undefined) p.xp = ps.override_xp;
      changed = true;
    }
    if (ps.boost_id && ps.boost_id !== p.boostId) {
      p.boostId = ps.boost_id;
      p.xp += 50;
      p.microGrowth = (p.microGrowth || 0) + 2;
      p.waterDate = p.sunDate = p.fertDate = todayKey();
      p.lastLog = ps.boost_msg || '💖 Rivishan sent a +50 XP Love Boost to our plant!';
      changed = true;
      if ($('#lock').hidden) toast(p.lastLog);
    }
    if (changed) ls.s('plant_v2', p);
  }
}

/* ---------- 1. Weekly 2-Pick Date Activity Poll Logic ---------- */
function getPollState() {
  const P = C.interactive?.live_poll || { question_id: 1, question: '', options: [] };
  let st = ls.g('poll_v2', null);
  if (!st || st.qid !== P.question_id) {
    st = { qid: P.question_id, weekStart: 0, currentPicks: [], historyPicks: [] };
  }
  // Check if 7 days have passed since the weekly picks were completed
  if (st.weekStart && Date.now() - st.weekStart >= WEEK_MS) {
    for (const pick of st.currentPicks) {
      if (!st.historyPicks.includes(pick)) st.historyPicks.push(pick);
    }
    st.currentPicks = [];
    st.weekStart = 0;
    ls.s('poll_v2', st);
  }
  return st;
}

function renderWeeklyPoll() {
  const P = C.interactive?.live_poll;
  if (!P || !P.question || !P.options?.length) return '';
  const st = getPollState();

  // Filter options that haven't been picked in previous weeks
  let unpickedPool = P.options.filter(o => !st.historyPicks.includes(o));
  // If fewer than 2 unpicked options remain and she hasn't started picking this week, reset history cycle so she always has choices
  if (unpickedPool.length < 2 && st.currentPicks.length === 0) {
    st.historyPicks = [];
    ls.s('poll_v2', st);
    unpickedPool = [...P.options];
  }

  const pickedCount = st.currentPicks.length;
  const isLocked = pickedCount >= 2 && st.weekStart && (Date.now() - st.weekStart < WEEK_MS);
  const remMs = isLocked ? (WEEK_MS - (Date.now() - st.weekStart)) : 0;

  let html = `<div class="status-banner">
    <span>🗓️ <b>Weekly Pick:</b> ${pickedCount} / 2 selected</span>
    <span style="color:var(--s);font-weight:600">${isLocked ? `⏳ Resets in ${fmtRemaining(remMs)}` : `✨ Pick ${2 - pickedCount} more`}</span>
  </div>`;

  if (pickedCount > 0) {
    html += `<div style="margin-bottom:10px">` +
      st.currentPicks.map((ans, idx) => `<div class="picked-pill"><span>✅ Choice #${idx + 1}:</span> <span>${esc(ans)}</span></div>`).join('') +
      `</div>`;
  }

  if (!isLocked) {
    const availableToClick = unpickedPool.filter(o => !st.currentPicks.includes(o));
    html += `<p style="font-size:13px;color:var(--muted);margin-bottom:8px">Select ${pickedCount === 0 ? '2 activities' : '1 more activity'} for our next date (resets every 7 days):</p>`;
    html += `<div>` + availableToClick.map(o => {
      const origIdx = P.options.indexOf(o);
      return `<button class="btn" data-a="poll" data-i="${origIdx}">${esc(o)}</button>`;
    }).join('') + `</div>`;
  } else {
    html += `<p style="font-size:13px;color:var(--muted);text-align:center;margin-top:4px">💖 Your 2 picks for this week are sent to Rivishan! Next week you can pick 2 new activities.</p>`;
  }

  return card(`<span>📊 ${esc(P.question)}</span><span class="badge">2 / Week</span>`, html, 'c2');
}

/* ---------- 2. 365-Day Interactive Love Plant Game Logic ---------- */
const PLANT_STAGES = [
  { min: 1, max: 7, name: 'Tiny Love Seed 🌱', sub: 'A new beginning taking root' },
  { min: 8, max: 30, name: 'Tender Sprout 🌿', sub: 'Growing stronger with daily care' },
  { min: 31, max: 90, name: 'Leafy Sapling 🪴', sub: 'Deep roots & vibrant green leaves' },
  { min: 91, max: 180, name: 'Budding Rose Bush 🌷', sub: 'Sweet buds forming on every branch' },
  { min: 181, max: 270, name: 'Blooming Love Tree 🌹', sub: 'Blossoming with romance & warmth' },
  { min: 271, max: 364, name: 'Golden Blossom Tree 🌸', sub: 'Radiant canopy of endless love' },
  { min: 365, max: 365, name: 'Eternal 365 Love Tree 🌳💖', sub: 'A full year of unwavering love!' }
];

function getPlantState() {
  const tk = todayKey();
  let p = ls.g('plant_v2', null);
  if (!p) {
    const legacy = ls.g('pl', 0);
    p = {
      daysCared: Math.max(1, legacy),
      xp: legacy * 25,
      microGrowth: legacy,
      lastCareDate: '',
      waterDate: '',
      sunDate: '',
      fertDate: '',
      lastLog: 'Care for our plant with Water, Sunlight & Fertilizer every day!',
      syncId: 0,
      boostId: 0
    };
    ls.s('plant_v2', p);
  }
  return p;
}

function getPlantStage(day) {
  return PLANT_STAGES.find(s => day >= s.min && day <= s.max) || PLANT_STAGES[PLANT_STAGES.length - 1];
}

function buildPlantSvg(p) {
  const tk = todayKey();
  const hasW = p.waterDate === tk;
  const hasS = p.sunDate === tk;
  const hasF = p.fertDate === tk;

  const day = Math.min(365, Math.max(1, p.daysCared || 1));
  const micro = p.microGrowth || 0;
  // Continuous growth ratio from 0.0 (Day 1) to 1.0 (Day 365) + micro growth per click
  const prog = Math.min(1, (day - 1) / 364 + (micro % 10) * 0.0025);

  const stemH = Math.round(28 + prog * 112); // grows from 28px to 140px
  const topY = 182 - stemH;
  const trunkW = (2.8 + prog * 9.5).toFixed(1);

  // Leaf count scales with days & micro actions so every care shows a change
  const leafCount = Math.min(26, 2 + Math.floor(day / 12) + Math.floor(micro / 2));
  let leavesSvg = '';
  for (let i = 0; i < leafCount; i++) {
    const frac = (i + 1) / (leafCount + 1);
    const ly = 180 - frac * (stemH - 8);
    const side = i % 2 === 0 ? 1 : -1;
    const spread = 10 + frac * (14 + prog * 38);
    const lx = 130 + side * spread;
    const rot = side * (25 - frac * 10);
    const lSize = (5.5 + prog * 5 + (i % 3)).toFixed(1);
    const leafCol = i % 3 === 0 ? '#4ade80' : i % 2 === 0 ? '#22c55e' : '#16a34a';
    leavesSvg += `<path d="M130 ${ly + 4} Q${130 + side * (spread * 0.5)} ${ly - 4} ${lx} ${ly}" stroke="#15803d" stroke-width="${Math.max(1.2, trunkW * 0.28)}" fill="none" stroke-linecap="round"/>`;
    leavesSvg += `<ellipse cx="${lx}" cy="${ly}" rx="${lSize}" ry="${(lSize * 0.58).toFixed(1)}" transform="rotate(${rot} ${lx} ${ly})" fill="${leafCol}"/>`;
  }

  // Canopy / Crown for mid-to-high stages (Day 20+)
  let canopySvg = '';
  if (day >= 15 || micro >= 6) {
    const cR = Math.min(54, 14 + prog * 42 + (micro % 5));
    canopySvg = `
      <circle cx="130" cy="${topY}" r="${cR}" fill="rgba(34,197,94,0.22)"/>
      <circle cx="${130 - cR * 0.45}" cy="${topY + 8}" r="${cR * 0.72}" fill="rgba(22,163,74,0.28)"/>
      <circle cx="${130 + cR * 0.45}" cy="${topY + 8}" r="${cR * 0.72}" fill="rgba(74,222,128,0.24)"/>
    `;
  }

  // Buds, Flowers & Glowing Hearts based on XP and Days
  const flowerCount = Math.min(18, Math.floor(day / 20) + Math.floor((p.xp || 0) / 45));
  let bloomsSvg = '';
  for (let j = 0; j < flowerCount; j++) {
    const angle = (j * 137.5) * (Math.PI / 180);
    const rad = 8 + (j % 4) * (6 + prog * 8);
    const fx = (130 + Math.cos(angle) * rad).toFixed(1);
    const fy = (topY + 10 + Math.sin(angle) * (rad * 0.7)).toFixed(1);
    const col = j % 3 === 0 ? '#fb7185' : j % 2 === 0 ? '#f43f5e' : '#facc15';
    bloomsSvg += `<circle cx="${fx}" cy="${fy}" r="${(3.2 + (j % 2) * 1.3).toFixed(1)}" fill="${col}" stroke="#fff" stroke-width="0.6"/>`;
  }

  // Top tip bud / heart blossom
  const tipBloom = day >= 5 || micro >= 2
    ? `<text x="130" y="${topY - 6}" text-anchor="middle" font-size="${Math.round(13 + prog * 10)}">${day >= 180 ? '🌸' : day >= 60 ? '🌹' : '🌱'}</text>`
    : '';

  // Active Sun, Water & Fertilizer Visual Effects
  const sunSvg = (hasS || plantFx === 'sun') ? `
    <g class="fx-sun">
      <circle cx="220" cy="34" r="16" fill="#facc15" opacity="0.9"/>
      <circle cx="220" cy="34" r="24" fill="rgba(250,204,21,0.25)"/>
    </g>` : `<circle cx="220" cy="34" r="11" fill="rgba(250,204,21,0.25)"/>`;

  const waterSvg = (plantFx === 'water') ? `
    <g class="fx-drop" fill="#38bdf8">
      <circle cx="115" cy="45" r="3.5"/><circle cx="130" cy="35" r="4"/><circle cx="145" cy="48" r="3.5"/>
    </g>` : '';

  const fertSvg = (hasF || plantFx === 'fert') ? `
    <g fill="#facc15" opacity="0.85">
      <circle cx="102" cy="182" r="2.2"/><circle cx="118" cy="185" r="2.5"/><circle cx="135" cy="183" r="2"/><circle cx="152" cy="185" r="2.5"/>
    </g>` : '';

  return `<svg viewBox="0 0 260 215" width="100%" height="205" style="display:block;margin:auto">
    <defs>
      <linearGradient id="potGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e11d48"/>
        <stop offset="100%" stop-color="#881337"/>
      </linearGradient>
      <linearGradient id="trunkGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#22c55e"/>
        <stop offset="100%" stop-color="${day > 45 ? '#854d0e' : '#15803d'}"/>
      </linearGradient>
    </defs>
    ${sunSvg}
    ${waterSvg}
    <g class="svg-tree-group">
      ${canopySvg}
      <!-- Main Stem / Trunk -->
      <path d="M130 184 Q${130 - Math.round(prog * 8)} ${184 - Math.round(stemH * 0.5)} 130 ${topY}" stroke="url(#trunkGrad)" stroke-width="${trunkW}" fill="none" stroke-linecap="round"/>
      ${leavesSvg}
      ${bloomsSvg}
      ${tipBloom}
    </g>
    <!-- Soil & Planter Pot -->
    <ellipse cx="130" cy="184" rx="44" ry="7" fill="#3f271d" stroke="#5c3a21" stroke-width="1.5"/>
    ${fertSvg}
    <path d="M90 184 L170 184 L158 210 L102 210 Z" fill="url(#potGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="130" y="201" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">♥ DAY ${day}/365 ♥</text>
  </svg>`;
}

/* ---------- Balanced Theme & Soft Ambient Particles ---------- */
const cv = $('#fx'), cx = cv.getContext('2d');
let W, H, ps = [], PT = 'hearts', CP = '#e11d48', CS = '#38bdf8', N = 22;
const GL = { hearts: '♥', stars: '✦', sparkles: '✧', erabadu: '✿', confetti: null };

function size() {
  W = cv.width = innerWidth;
  H = cv.height = innerHeight;
}
addEventListener('resize', size);
size();

function mk(b) {
  return {
    x: Math.random() * W,
    y: b ? H * 0.45 : -20,
    vx: b ? (Math.random() - 0.5) * 6 : 0,
    vy: b ? -4 - Math.random() * 5 : 0.45 + Math.random() * 0.9,
    s: 11 + Math.random() * 11,
    r: Math.random() * 6,
    c: Math.random() < 0.6 ? CP : CS,
    b
  };
}

function burst(n) {
  cv.classList.add('top');
  setTimeout(() => cv.classList.remove('top'), 3500);
  for (let i = 0; i < n; i++) ps.push(mk(true));
}

function loop() {
  cx.clearRect(0, 0, W, H);
  const g = PT in GL ? GL[PT] : '♥';
  for (const p of ps) {
    p.x += p.vx + Math.sin(p.y / 65 + p.r) * 0.35;
    p.y += p.vy;
    p.r += 0.015;
    if (p.b) p.vy += 0.14;
    else if (p.y > H + 20) {
      p.y = -20;
      p.x = Math.random() * W;
    }
    cx.save();
    cx.translate(p.x, p.y);
    cx.rotate(p.r);
    cx.fillStyle = p.c;
    cx.globalAlpha = p.b ? 0.9 : 0.55;
    if (g === null) cx.fillRect(-3, -5, 6, 10);
    else {
      cx.font = p.s + 'px sans-serif';
      cx.fillText(g, -p.s / 2, p.s / 2);
    }
    cx.restore();
  }
  ps = ps.filter(p => !p.b || p.y < H + 30);
  while (ps.filter(p => !p.b).length < N) ps.push(mk(false));
  requestAnimationFrame(loop);
}
if (!matchMedia('(prefers-reduced-motion:reduce)').matches) loop();

function theme() {
  const t = C.theme_engine, R = document.documentElement.style;
  let m = t.mode;
  const d = new Date(), md = (d.getMonth() + 1) * 100 + d.getDate(), h = d.getHours();
  const auto = m === 'auto';
  if (auto) {
    m = md === 1021 ? 'birthday' : md === 1003 ? 'rivi_bday' : (md === 413 || md === 414) ? 'avurudu' : (h >= 22 || h < 5) ? 'night' : 'love';
  }
  const P = {
    love: ['#e11d48', '#38bdf8', 'hearts'],
    birthday: ['#ec4899', '#facc15', 'confetti'],
    avurudu: ['#ea580c', '#facc15', 'erabadu'],
    night: ['#8b5cf6', '#38bdf8', 'stars'],
    rivi_bday: ['#2563eb', '#38bdf8', 'sparkles']
  };
  let [p, s, pt] = P[m] || P.love;
  mode = m;
  if (m === 'custom') {
    p = t.custom_primary_color || p;
    s = t.custom_secondary_color || s;
    if (t.custom_bg_color) R.setProperty('--bg', t.custom_bg_color);
    if (t.custom_card_color) R.setProperty('--card', t.custom_card_color);
    if (t.custom_text_color) R.setProperty('--tx', t.custom_text_color);
  } else {
    ['--bg', '--card', '--tx'].forEach(k => R.removeProperty(k));
  }
  R.setProperty('--p', p);
  R.setProperty('--s', s);
  R.setProperty('--r', (t.card_corner_radius || 22) + 'px');
  CP = p;
  CS = s;
  PT = auto ? pt : (t.falling_particle_type || pt);
  N = C.feature_toggles.love_bomb_mode ? 55 : 22;
  ps = [];
  document.body.style.backgroundImage = t.custom_wallpaper_url ? `url("${t.custom_wallpaper_url.replace(/"/g, '%22')}")` : '';
  document.title = t.header_title || 'Anuki ♥ Rivishan';
}

/* ---------- Security Lock Screen ---------- */
const PL = () => Math.max((C.security.main_pin || '20230117').length, (C.security.safe_guest_pin || '00000000').length);

function dots() {
  $('#dots').innerHTML = Array.from({ length: C ? PL() : 8 }, (_, i) => `<b class="${i < pin.length ? 'f' : ''}"></b>`).join('');
}

$('#pad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<i></i>' : `<button data-k="${k}">${k}</button>`).join('');

function press(k) {
  if (!C) return;
  if (k === '⌫') pin = pin.slice(0, -1);
  else if (pin.length < PL()) pin += k;
  dots();
  const S = C.security;
  if (pin === S.main_pin) return enter(false);
  if (pin === S.safe_guest_pin) return enter(true);
  if (pin.length >= PL()) {
    post('wrong_pin', pin);
    const msgs = S.wrong_pin_messages || ['Incorrect PIN, please try again.'];
    $('#wm').textContent = msgs[wr++ % msgs.length];
    if (S.voice_hint_url) $('#vh').hidden = false;
    $('#lock').classList.add('sh');
    setTimeout(() => {
      $('#lock').classList.remove('sh');
      pin = '';
      dots();
    }, 450);
  }
}

function enter(g) {
  guest = g;
  prev = ls.g('seen', 0);
  ls.s('seen', Date.now());
  $('#lock').hidden = true;
  $('#app').hidden = false;
  $('#nav').hidden = g;
  $('#mu').hidden = g || !bgUrl();
  if (!g) {
    post('app_opened');
    play(bgUrl());
    popups();
  }
  render();
}

/* ---------- Live Popups & Notifications ---------- */
function modal(t, m) {
  $('#md').innerHTML = `<div class="card"><h3>✨ ${esc(t)}</h3><p style="margin-bottom:14px">${esc(m)}</p><button class="btn p" data-a="x">Close 💖</button></div>`;
  $('#md').hidden = false;
}

function popups() {
  const L = C.live_popup, Nn = C.notification;
  if (L && L.enabled && ls.g('pop', 0) != L.popup_id) {
    ls.s('pop', L.popup_id);
    modal(L.title, L.message);
    if (L.trigger_heartbeat_vibration) navigator.vibrate?.([200, 100, 200, 100, 500]);
  }
  if (Nn && Nn.title && Nn.notif_id != ls.g('nid', 0)) {
    ls.s('nid', Nn.notif_id);
    toast(Nn.title + ' — ' + Nn.message);
    try {
      if (Notification.permission === 'granted') new Notification(Nn.title, { body: Nn.message });
    } catch {}
  }
}

/* ---------- Views & Sections ---------- */
const card = (t, b, c = '') => `<section class="card ${c}">${t ? `<h3>${t}</h3>` : ''}${b}</section>`;

function nowMsg() {
  const h = new Date().getHours(), A = C.auto_pilot;
  if (h >= 5 && h < 10 && A.meal_morning) return A.meal_morning;
  if (h >= 12 && h < 15 && A.meal_lunch) return A.meal_lunch;
  if (h >= 19 && h < 22 && A.meal_night) return A.meal_night;
  if ((h >= 23 || h < 5) && A.late_night_msg) return A.late_night_msg;
  return A.hourly_thoughts?.length ? A.hourly_thoughts[h % A.hourly_thoughts.length] : '';
}

function bday() {
  const d = new Date();
  const parts = (C.couple_info.girl_dob || '2006-10-21').split('-');
  const bMonth = +parts[1] - 1, bDate = +parts[2];
  const t0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  let n = new Date(d.getFullYear(), bMonth, bDate);
  if (n < t0) n.setFullYear(n.getFullYear() + 1);
  const k = Math.round((n - t0) / 864e5);
  return k
    ? `<div class="ct"><span class="big">${k}</span><br><span style="font-weight:600">Days Until ${esc(C.couple_info.girl_name)}'s Birthday 🎂</span><br><small>ඔයාගේ උපන්දිනයට තව දවස් ${k}යි</small></div>`
    : `<div class="ct"><span class="big" style="font-size:26px">Happy Birthday ${esc(C.couple_info.girl_name)}! 🎂💖</span><br><small>සුබම සුබ උපන්දිනයක් මගේ මැණික!</small></div>`;
}

function tick() {
  const e = $('#tk');
  if (!e || !C) return;
  const n = Date.now() - new Date(C.couple_info.anniversary_date.replace(' ', 'T'));
  const f = (x, m) => Math.floor(n / x) % m;
  e.innerHTML = `<span class="big">${Math.floor(n / 864e5)}</span><br><span style="font-weight:600">Days Together</span><br><div class="timer-pills"><span>${f(36e5, 24)}h</span><span>•</span><span>${f(6e4, 60)}m</span><span>•</span><span>${f(1e3, 60)}s</span></div>`;
}
setInterval(tick, 1000);

function cd(v) {
  return Math.ceil((new Date(v.unlock_date.replace(' ', 'T')) - Date.now()) / 864e5);
}

/* ---------- Scratch Card Canvas ---------- */
function scratch() {
  const c = $('#scv'), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 310, 175);
  g.addColorStop(0, CP);
  g.addColorStop(1, CS);
  x.fillStyle = g;
  x.fillRect(0, 0, 310, 175);
  x.fillStyle = '#ffffff';
  x.font = '600 16px Plus Jakarta Sans, sans-serif';
  x.textAlign = 'center';
  x.fillText('✨ Scratch Here to Reveal ✨', 155, 92);

  let d = 0;
  const at = e => {
    const r = c.getBoundingClientRect();
    x.globalCompositeOperation = 'destination-out';
    x.beginPath();
    x.arc((e.clientX - r.left) * 310 / r.width, (e.clientY - r.top) * 175 / r.height, 20, 0, 7);
    x.fill();
  };
  c.onpointerdown = e => {
    d = 1;
    try { c.setPointerCapture(e.pointerId); } catch {}
    at(e);
  };
  c.onpointermove = e => d && at(e);
  c.onpointerup = c.onpointercancel = () => {
    d = 0;
    const a = x.getImageData(0, 0, 310, 175).data;
    let n = 0;
    for (let i = 3; i < a.length; i += 16) if (!a[i]) n++;
    if (n > a.length / 16 * 0.48) {
      c.classList.add('off');
      navigator.vibrate?.(80);
    }
  };
}

    const c = $('#cake');

    c.querySelectorAll('.fl').forEach((f, i) => f.style.transitionDelay = i * 110 + 'ms');
    c.classList.add('off');

  async mic(i, b) {
    if (micOn) return;
    let st, ac, t;
    const end = () => {
      clearInterval(t);
      st?.getTracks().forEach(k => k.stop());
      ac?.close();
      micOn = 0;
    };
    try {
      st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const an = ac.createAnalyser();
      an.fftSize = 512;
      ac.createMediaStreamSource(st).connect(an);
      const d = new Uint8Array(an.fftSize);
      let n = 0;
      micOn = 1;
      b.textContent = '🎤 Blow now...';
      t = setInterval(() => {
        if (!$('#cake')) return end();
        an.getByteTimeDomainData(d);
        let m = 0;
        for (const v of d) m = Math.max(m, Math.abs(v - 128));
        n = m > 32 ? n + 1 : Math.max(0, n - 1);
        if (n >= 4) {
          end();
          A.blow();
        }
      }, 60);
    } catch {
      end();
      toast('Microphone blocked — tap "Tap to Blow" instead');
    }
  },
  inst() {
    dip?.prompt();
    dip = null;
    render();
  },
  fc() { $('#fc').textContent = rnd(C.interactive.fortune_cookies); },

  // 1. Weekly 2-Pick Poll Action
  poll(i) {
    const P = C.interactive.live_poll;
    const chosen = P.options[i];
    if (!chosen) return;
    const st = getPollState();
    if (st.currentPicks.length >= 2 || st.currentPicks.includes(chosen)) return;

    st.currentPicks.push(chosen);
    if (st.currentPicks.length === 1 && !st.weekStart) {
      st.weekStart = Date.now();
    } else if (st.currentPicks.length === 2) {
      st.weekStart = Date.now();
    }
    ls.s('poll_v2', st);
    navigator.vibrate?.(60);

    const pickLabel = `Pick ${st.currentPicks.length}/2: ${chosen}` +
      (st.currentPicks.length === 2 ? ` (Weekly Pair: ${st.currentPicks.join(' + ')})` : '');
    post('poll_answer', pickLabel);
    toast(st.currentPicks.length < 2 ? `✅ Pick #1 saved! Choose 1 more activity` : `💖 Both weekly activities selected!`);
    render();
  },

  // 2. 365-Day Love Plant Care Action (Water, Sunlight, Fertilizer)
  pcare(type) {
    const p = getPlantState();
    const tk = todayKey();
    const prevStage = getPlantStage(p.daysCared || 1).name;

    // Advance day counter (up to 365) once per calendar day when first cared for
    if (p.lastCareDate !== tk) {
      p.daysCared = p.lastCareDate ? Math.min(365, (p.daysCared || 1) + 1) : Math.max(1, p.daysCared || 1);
      p.lastCareDate = tk;
    }

    let gainedXp = 0;
    let actionLabel = '';

    if (type === 'water') {
      if (p.waterDate === tk) {
        toast('💧 Already watered today! Come back tomorrow for +15 XP.');
        return;
      }
      p.waterDate = tk;
      gainedXp = 15;
      actionLabel = '💧 Watered plant (+15 XP) — Stem grew +0.15 cm & leaves refreshed!';
    } else if (type === 'sun') {
      if (p.sunDate === tk) {
        toast('☀️ Already gave sunlight today! Come back tomorrow for +15 XP.');
        return;
      }
      p.sunDate = tk;
      gainedXp = 15;
      actionLabel = '☀️ Gave warm sunlight (+15 XP) — New leaf sprouted & +0.15 cm growth!';
    } else if (type === 'fert') {
      if (p.fertDate === tk) {
        toast('🌱 Already fertilized today! Come back tomorrow for +20 XP.');
        return;
      }
      p.fertDate = tk;
      gainedXp = 20;
      actionLabel = '🌱 Added rich fertilizer (+20 XP) — Roots strengthened & +0.15 cm growth!';
    }

    p.xp = (p.xp || 0) + gainedXp;
    p.microGrowth = (p.microGrowth || 0) + 1;

    // Check if all 3 daily care actions are completed today for a Combo Bonus
    if (p.waterDate === tk && p.sunDate === tk && p.fertDate === tk && p.comboDate !== tk) {
      p.comboDate = tk;
      p.xp += 25;
      p.microGrowth += 1;
      actionLabel = `🌟 All 3 Daily Cares Complete! (+25 Bonus XP) • Day ${p.daysCared}/365!`;
      burst(45);
    }

    p.lastLog = actionLabel;
    ls.s('plant_v2', p);
    plantFx = type;
    setTimeout(() => { plantFx = ''; }, 1500);

    navigator.vibrate?.([50, 40, 60]);
    toast(actionLabel);

    const newStage = getPlantStage(p.daysCared).name;
    post('plant_care', `${actionLabel} | Day ${p.daysCared}/365 | Total XP: ${p.xp}`);
    if (newStage !== prevStage || p.daysCared === 365) {
      post('plant_milestone', `Reached ${newStage} on Day ${p.daysCared}/365 (${p.xp} XP)!`);
    }
    render();
  },

    post('envelope_opened', e.title);
  },

  // 3. Weekly Love Coupon Redeem Action
  cp(id) {
    const st = getCouponState();
    if (st.lastRedeemAt && Date.now() - st.lastRedeemAt < WEEK_MS) {
      toast(`⏳ You can redeem your next coupon in ${fmtRemaining(WEEK_MS - (Date.now() - st.lastRedeemAt))}`);
      return;
    }
    const found = C.coupons.find(c => c.id == id) || { title: id };
    const nextSt = {
      lastRedeemAt: Date.now(),
      redeemedId: id,
      redeemedTitle: found.title
    };
    ls.s('cp_v2', nextSt);
    navigator.vibrate?.([70, 50, 70]);
    post('coupon_redeemed', found.title);
    toast(`🎟️ Redeemed: ${found.title}! (Resets in 7 days)`);
    render();
  },

  rp() {
    const v = $('#rp').value.trim();
    if (!v) return;
    post('direct_reply', v);
    $('#rp').value = '';
    toast('💌 Message sent to Rivishan!');
  },
  tc() {
    const v = $('#tc').value.trim();
    if (!v) return;
    post('time_capsule', v);
    $('#tc').value = '';
    toast('⏳ Sealed inside the Time Capsule!');
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a],[data-k],[data-t]');
  if (!b) return;
  if (b.dataset.k !== undefined) return press(b.dataset.k);
  if (b.dataset.t) {
    tab = b.dataset.t;
    render();
    scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const i = b.dataset.i;
  A[b.dataset.a]?.(isNaN(i) || i === undefined ? i : +i, b);
});

document.addEventListener('visibilitychange', () => {
  if (C && $('#lock').hidden) ls.s('seen', Date.now());
});

/* ---------- Boot & Auto-Sync ---------- */
let dip, micOn = 0;
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  dip = e;
  if (C && !$('#app').hidden && tab === 'home' && !guest) render();
});

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

(async () => {
  await load();
  if (!C) {
    $('#lq').textContent = 'Unable to load configuration. Please check your internet connection.';
    return;
  }
  theme();
  lockInit();
  setInterval(async () => {
    if (await load()) {
      theme();
      lockInit();
      if (!$('#app').hidden) {
        render();
        if (!guest) popups();
      }
    }
  }, 6e4);
})();
</script>
</body>
</html>

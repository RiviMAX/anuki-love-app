<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0714">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/api/icon?s=192">
<link rel="apple-touch-icon" href="/api/icon?s=192">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Anuki ♥ Rivishan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --p: #e11d48;
  --s: #38bdf8;
  --bg: #0b0714;
  --card: #151024;
  --tx: #f8fafc;
  --muted: #94a3b8;
  --r: 22px;
  --p-soft: color-mix(in srgb, var(--p) 18%, transparent);
  --s-soft: color-mix(in srgb, var(--s) 16%, transparent);
  --border: color-mix(in srgb, var(--tx) 10%, transparent);
  --border-p: color-mix(in srgb, var(--p) 38%, transparent);
  --border-s: color-mix(in srgb, var(--s) 35%, transparent);
}

* {
  box-sizing: border-box;
  margin: 0;
  -webkit-tap-highlight-color: transparent;
}

[hidden] {
  display: none !important;
}

html, body {
  min-height: 100%;
}

body {
  background: var(--bg) center / cover fixed;
  color: var(--tx);
  font: 15px/1.65 'Plus Jakarta Sans', 'Noto Sans Sinhala', system-ui, sans-serif;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(65% 45% at 10% 0%, var(--p-soft), transparent),
    radial-gradient(55% 40% at 95% 30%, var(--s-soft), transparent),
    linear-gradient(180deg, rgba(11, 7, 20, 0.4) 0%, rgba(11, 7, 20, 0.82) 100%);
  z-index: 0;
}

#fx {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.65;
}
#fx.top {
  z-index: 35;
  opacity: 1;
}

/* ---------- Layout & Header ---------- */
.app {
  position: relative;
  z-index: 1;
  max-width: 540px;
  margin: auto;
  padding: calc(20px + env(safe-area-inset-top)) 16px 115px;
}

header {
  text-align: center;
  padding: 12px 10px 18px;
  margin-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #ffffff;
  line-height: 1.3;
}

.sub {
  font-size: 13px;
  font-weight: 500;
  color: var(--s);
  margin-top: 4px;
  letter-spacing: 0.02em;
}

.nick {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--tx);
  background: var(--p-soft);
  border: 1px solid var(--border-p);
  border-radius: 999px;
}

/* ---------- Distinct Cards ---------- */
.card {
  position: relative;
  background: color-mix(in srgb, var(--card) 90%, transparent);
  border: 1px solid var(--border);
  border-top: 2px solid var(--border-p);
  border-radius: var(--r);
  padding: 18px;
  margin: 16px 0;
  box-shadow: 0 10px 28px -8px rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(12px);
}

.card.c2 {
  border-top-color: var(--border-s);
}

.card h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.01em;
}

.card p {
  color: color-mix(in srgb, var(--tx) 92%, transparent);
  font-size: 14.5px;
}

/* ---------- Counters & Typography ---------- */
.big {
  font-size: 42px;
  font-weight: 700;
  line-height: 1.1;
  color: var(--p);
  letter-spacing: -0.02em;
}

.ct {
  text-align: center;
  margin: 6px 0;
}

.ct small {
  color: var(--muted);
  font-size: 13px;
}

.timer-pills {
  display: inline-flex;
  gap: 8px;
  margin-top: 8px;
  padding: 5px 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: var(--s);
}

/* ---------- Buttons & Inputs ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--border);
  color: var(--tx);
  background: rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  padding: 9px 16px;
  font: 600 13.5px/1.3 inherit;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
  margin: 6px 6px 0 0;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.09);
  border-color: var(--border-s);
}

.btn.p {
  border-color: var(--border-p);
  color: #ffffff;
  background: linear-gradient(135deg, var(--p), color-mix(in srgb, var(--p) 72%, #000));
  box-shadow: 0 4px 14px color-mix(in srgb, var(--p) 30%, transparent);
}

.btn:active {
  transform: scale(0.96);
}

.btn[disabled] {
  opacity: 0.45;
  cursor: not-allowed;
}

textarea {
  width: 100%;
  min-height: 80px;
  background: rgba(0, 0, 0, 0.28);
  color: var(--tx);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  font: inherit;
  font-size: 14px;
  margin-bottom: 8px;
  outline: none;
  transition: border-color 0.2s;
}

textarea:focus {
  border-color: var(--s);
}

/* ---------- Memories & List Items ---------- */
.mem img {
  width: 100%;
  border-radius: calc(var(--r) - 8px);
  margin-bottom: 12px;
  border: 1px solid var(--border);
  display: block;
}

.mem-date {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  color: var(--s);
  background: var(--s-soft);
  padding: 2px 10px;
  border-radius: 999px;
  margin-bottom: 6px;
}

.mem b {
  display: block;
  font-size: 16px;
  color: #fff;
  margin-bottom: 4px;
}

.it {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: 14px;
}

.it:last-child {
  margin-bottom: 0;
}

.it small {
  color: var(--muted);
  font-size: 12.5px;
}

/* ---------- Interactive Widgets ---------- */
.sc {
  position: relative;
  width: 310px;
  max-width: 100%;
  height: 175px;
  margin: 6px auto;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border-p);
  background: rgba(0, 0, 0, 0.4);
}

.sc .un {
  position: absolute;
  inset: 0;
  padding: 14px;
  font-size: 14px;
  overflow: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.sc .un img {
  max-width: 100%;
  max-height: 110px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 8px;
}

.sc canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
  transition: opacity 0.6s ease;
  cursor: pointer;
}

.sc canvas.off {
  opacity: 0;
  pointer-events: none;
}

.th {
  width: 136px;
  height: 136px;
  margin: 10px auto;
  border-radius: 50%;
  background: radial-gradient(circle, var(--p-soft) 0%, rgba(255,255,255,0.02) 75%);
  border: 2px solid var(--border-p);
  display: grid;
  place-items: center;
  font-size: 50px;
  box-shadow: 0 8px 25px color-mix(in srgb, var(--p) 22%, transparent);
  touch-action: none;
  user-select: none;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.th:active {
  animation: pulseBeat 0.65s infinite;
}

@keyframes pulseBeat {
  50% { transform: scale(1.1); }
}

.bomb {
  border: 1.5px solid var(--p);
  background: linear-gradient(135deg, color-mix(in srgb, var(--p) 22%, var(--card)), var(--card));
}

/* ---------- Birthday Cake SVG ---------- */
#cake .fl {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: fk 0.5s ease-in-out infinite alternate;
  transition: opacity 0.3s;
}
@keyframes fk {
  to { transform: scale(0.88, 1.15); }
}
#cake.off .fl {
  opacity: 0;
  animation: none;
}
#cake .sm {
  opacity: 0;
  fill: none;
  stroke: #cbd5e1;
  stroke-width: 1.6;
  transform-box: fill-box;
}
#cake.off .sm {
  animation: sm 2s ease-out forwards;
}
@keyframes sm {
  0% { opacity: 0.75; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-22px); }
}

/* ---------- Bottom Navigation Bar ---------- */
nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  display: flex;
  max-width: 540px;
  margin: auto;
  background: color-mix(in srgb, var(--card) 94%, #000);
  border-top: 1px solid var(--border);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  backdrop-filter: blur(16px);
}

nav button {
  flex: 1;
  background: transparent;
  border: 0;
  color: var(--muted);
  font: 600 12px/1.2 inherit;
  padding: 8px 4px;
  border-radius: 14px;
  cursor: pointer;
  transition: color 0.2s, background 0.2s;
}

nav button b {
  display: block;
  font-size: 20px;
  margin-bottom: 3px;
  filter: grayscale(0.85);
  transition: filter 0.2s, transform 0.2s;
}

nav button.on {
  color: #ffffff;
  background: var(--p-soft);
}

nav button.on b {
  filter: none;
  transform: translateY(-1px);
}

/* ---------- Floating Music Button ---------- */
#mu {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top));
  right: 14px;
  z-index: 12;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--card) 88%, #000);
  color: #fff;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
}

/* ---------- Lock Screen ---------- */
#lock {
  position: fixed;
  inset: 0;
  z-index: 25;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 24px;
  text-align: center;
}

#lock.sh {
  animation: sk 0.4s;
}
@keyframes sk {
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

.lock-badge {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--p-soft);
  border: 1px solid var(--border-p);
  display: grid;
  place-items: center;
  font-size: 24px;
  margin-bottom: 2px;
}

#dots {
  display: flex;
  gap: 10px;
  margin: 6px 0;
}

#dots b {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1.5px solid var(--muted);
  transition: all 0.2s;
}

#dots b.f {
  background: var(--p);
  border-color: var(--p);
  transform: scale(1.1);
}

#pad {
  display: grid;
  grid-template-columns: repeat(3, 68px);
  gap: 12px;
  margin-top: 4px;
}

#pad button {
  height: 68px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.04);
  color: #fff;
  font: 600 22px inherit;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}

#pad button:active {
  background: var(--p-soft);
  border-color: var(--p);
  transform: scale(0.94);
}

#wm {
  min-height: 44px;
  max-width: 320px;
  font-size: 13px;
  color: var(--s);
}

/* ---------- Modal & Toast ---------- */
#md {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(6px);
  display: grid;
  place-items: center;
  padding: 20px;
}

#md .card {
  max-width: 400px;
  width: 100%;
  text-align: center;
}

#md .card h3 {
  justify-content: center;
}

#ts {
  width: max-content;
  position: fixed;
  left: 50%;
  top: calc(14px + env(safe-area-inset-top));
  transform: translate(-50%, -150%);
  z-index: 40;
  max-width: 90%;
  background: var(--card);
  border: 1px solid var(--border-s);
  border-radius: 14px;
  padding: 10px 16px;
  font-size: 13.5px;
  font-weight: 600;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

#ts.on {
  transform: translate(-50%, 0);
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<!-- Lock Screen -->
<div id="lock">
  <div class="lock-badge">🔒</div>
  <h1 id="lt">Anuki ♥ Rivishan</h1>
  <p id="lq" style="max-width:320px;font-size:14px;color:var(--muted)">Loading...</p>
  <p style="font-size:12px;color:var(--s)">Enter our special date (YYYYMMDD)</p>
  <div id="dots"></div>
  <div id="pad"></div>
  <p id="wm"></p>
  <button class="btn" id="vh" data-a="vh" hidden>🎧 Play Voice Hint</button>
</div>

<!-- Main App Container -->
<main class="app" id="app" hidden></main>

<!-- Clean English Bottom Navigation -->
<nav id="nav" hidden>
  <button data-t="home"><b>🏠</b>Home</button>
  <button data-t="us"><b>💞</b>Us</button>
  <button data-t="play"><b>🎮</b>Games</button>
  <button data-t="inbox"><b>💌</b>Inbox</button>
</nav>

<button id="mu" title="Toggle Music" hidden>🎵</button>
<div id="md" hidden></div>
<div id="ts"></div>

<script>
const RAW = 'https://raw.githubusercontent.com/RiviMAX/anuki-love-app/main/config.json';
const HOOK = /vercel\.app|localhost/.test(location.hostname) ? '/api/webhook' : 'https://anuki-love-app.vercel.app/api/webhook';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = {
  g(k, d) { try { return JSON.parse(localStorage.getItem('al_' + k)) ?? d; } catch { return d; } },
  s(k, v) { try { localStorage.setItem('al_' + k, JSON.stringify(v)); } catch {} }
};

let C, raw = '', tab = 'home', guest = false, mode = 'love', pin = '', wr = 0, prev = 0, q = { i: 0, s: 0 }, pool = '';

const post = (event, data = '') => {
  try {
    fetch(HOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source: 'anuki_app', event, data: String(data) }),
      keepalive: true
    });
  } catch {}
};

const toast = t => {
  const e = $('#ts');
  e.textContent = t;
  e.className = 'on';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.className = '', 4000);
};

const rnd = a => (Array.isArray(a) && a.length ? a[Math.floor(Math.random() * a.length)] : '');

async function load() {
  for (const u of [RAW + '?t=' + Date.now(), 'config.json']) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (r.ok) {
        const t = await r.text();
        if (t === raw) return false;
        C = JSON.parse(t);
        raw = t;
        return true;
      }
    } catch {}
  }
  return false;
}

/* ---------- Balanced Theme & Soft Ambient Particles ---------- */
const cv = $('#fx'), cx = cv.getContext('2d');
let W, H, ps = [], PT = 'hearts', CP = '#e11d48', CS = '#38bdf8', N = 22;
const GL = { hearts: '♥', stars: '✦', sparkles: '✧', erabadu: '✿', confetti: null };

function size() {
  W = cv.width = innerWidth;
  H = cv.height = innerHeight;
}
addEventListener('resize', size);
size();

function mk(b) {
  return {
    x: Math.random() * W,
    y: b ? H * 0.45 : -20,
    vx: b ? (Math.random() - 0.5) * 6 : 0,
    vy: b ? -4 - Math.random() * 5 : 0.45 + Math.random() * 0.9,
    s: 11 + Math.random() * 11,
    r: Math.random() * 6,
    c: Math.random() < 0.6 ? CP : CS,
    b
  };
}

function burst(n) {
  cv.classList.add('top');
  setTimeout(() => cv.classList.remove('top'), 3500);
  for (let i = 0; i < n; i++) ps.push(mk(true));
}

function loop() {
  cx.clearRect(0, 0, W, H);
  const g = PT in GL ? GL[PT] : '♥';
  for (const p of ps) {
    p.x += p.vx + Math.sin(p.y / 65 + p.r) * 0.35;
    p.y += p.vy;
    p.r += 0.015;
    if (p.b) p.vy += 0.14;
    else if (p.y > H + 20) {
      p.y = -20;
      p.x = Math.random() * W;
    }
    cx.save();
    cx.translate(p.x, p.y);
    cx.rotate(p.r);
    cx.fillStyle = p.c;
    cx.globalAlpha = p.b ? 0.9 : 0.55;
    if (g === null) cx.fillRect(-3, -5, 6, 10);
    else {
      cx.font = p.s + 'px sans-serif';
      cx.fillText(g, -p.s / 2, p.s / 2);
    }
    cx.restore();
  }
  ps = ps.filter(p => !p.b || p.y < H + 30);
  while (ps.filter(p => !p.b).length < N) ps.push(mk(false));
  requestAnimationFrame(loop);
}
if (!matchMedia('(prefers-reduced-motion:reduce)').matches) loop();

function theme() {
  const t = C.theme_engine, R = document.documentElement.style;
  let m = t.mode;
  const d = new Date(), md = (d.getMonth() + 1) * 100 + d.getDate(), h = d.getHours();
  const auto = m === 'auto';
  if (auto) {
    m = md === 1021 ? 'birthday' : md === 1003 ? 'rivi_bday' : (md === 413 || md === 414) ? 'avurudu' : (h >= 22 || h < 5) ? 'night' : 'love';
  }
  const P = {
    love: ['#e11d48', '#38bdf8', 'hearts'],
    birthday: ['#ec4899', '#facc15', 'confetti'],
    avurudu: ['#ea580c', '#facc15', 'erabadu'],
    night: ['#8b5cf6', '#38bdf8', 'stars'],
    rivi_bday: ['#2563eb', '#38bdf8', 'sparkles']
  };
  let [p, s, pt] = P[m] || P.love;
  mode = m;
  if (m === 'custom') {
    p = t.custom_primary_color || p;
    s = t.custom_secondary_color || s;
    if (t.custom_bg_color) R.setProperty('--bg', t.custom_bg_color);
    if (t.custom_card_color) R.setProperty('--card', t.custom_card_color);
    if (t.custom_text_color) R.setProperty('--tx', t.custom_text_color);
  } else {
    ['--bg', '--card', '--tx'].forEach(k => R.removeProperty(k));
  }
  R.setProperty('--p', p);
  R.setProperty('--s', s);
  R.setProperty('--r', (t.card_corner_radius || 22) + 'px');
  CP = p;
  CS = s;
  PT = auto ? pt : (t.falling_particle_type || pt);
  N = C.feature_toggles.love_bomb_mode ? 55 : 22;
  ps = [];
  document.body.style.backgroundImage = t.custom_wallpaper_url ? `url("${t.custom_wallpaper_url.replace(/"/g, '%22')}")` : '';
  document.title = t.header_title || 'Anuki ♥ Rivishan';
}

/* ---------- Music Player ---------- */
const au = new Audio();
au.loop = true;
let mOn = true;
const bgUrl = () => mode === 'avurudu' ? C.media.avurudu_music_url : C.media.bg_music_url;

function play(u, force) {
  if (!u || (!mOn && !force)) return;
  if (au.src !== u) au.src = u;
  au.play().catch(() => {});
}

$('#mu').onclick = () => {
  mOn = !mOn;
  $('#mu').style.opacity = mOn ? 1 : 0.45;
  mOn ? play(bgUrl()) : au.pause();
};

/* ---------- Security Lock Screen ---------- */
const PL = () => Math.max((C.security.main_pin || '20230117').length, (C.security.safe_guest_pin || '00000000').length);

function dots() {
  $('#dots').innerHTML = Array.from({ length: C ? PL() : 8 }, (_, i) => `<b class="${i < pin.length ? 'f' : ''}"></b>`).join('');
}

$('#pad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<i></i>' : `<button data-k="${k}">${k}</button>`).join('');

function press(k) {
  if (!C) return;
  if (k === '⌫') pin = pin.slice(0, -1);
  else if (pin.length < PL()) pin += k;
  dots();
  const S = C.security;
  if (pin === S.main_pin) return enter(false);
  if (pin === S.safe_guest_pin) return enter(true);
  if (pin.length >= PL()) {
    post('wrong_pin', pin);

/* ---------- Scratch Card Canvas ---------- */
function scratch() {
  const c = $('#scv'), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 310, 175);
  g.addColorStop(0, CP);
  g.addColorStop(1, CS);
  x.fillStyle = g;
  x.fillRect(0, 0, 310, 175);
  x.fillStyle = '#ffffff';
  x.font = '600 16px Plus Jakarta Sans, sans-serif';
  x.textAlign = 'center';
  x.fillText('✨ Scratch Here to Reveal ✨', 155, 92);

  let d = 0;
  const at = e => {
    const r = c.getBoundingClientRect();
    x.globalCompositeOperation = 'destination-out';
    x.beginPath();
    x.arc((e.clientX - r.left) * 310 / r.width, (e.clientY - r.top) * 175 / r.height, 20, 0, 7);
    x.fill();
  };
  c.onpointerdown = e => {
    d = 1;
    try { c.setPointerCapture(e.pointerId); } catch {}
    at(e);
  };
  c.onpointermove = e => d && at(e);
  c.onpointerup = c.onpointercancel = () => {
    d = 0;
    const a = x.getImageData(0, 0, 310, 175).data;
    let n = 0;
    for (let i = 3; i < a.length; i += 16) if (!a[i]) n++;
    if (n > a.length / 16 * 0.48) {
      c.classList.add('off');
      navigator.vibrate?.(80);
    }
  };
}

    try {
      st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
